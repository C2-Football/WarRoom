name: CI
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx eslint . --ext .js
      - run: node tests/run.js
      - run: node scripts/build-time-league-helmet-sources.cjs --check && node tests/time-league-helmet-artwork.js && node tests/time-league-helmet.js
