<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#08080B">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://sxshiqyxhhifvtfqawbq.supabase.co; frame-ancestors 'none'; base-uri 'self'; object-src 'none';">
  <title>Dynasty HQ — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500;600;700&amp;family=Rajdhani:wght@600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --gold: #D4AF37;
      --gold-bright: #F0CD58;
      --black: #08080B;
      --off-black: #15151B;
      --charcoal: #27262E;
      --white: #F5F2EA;
      --silver: #BDB8AD;
      --muted: #77736B;
      --good: #2ECC71;
      --bad: #E74C3C;
      --sat: env(safe-area-inset-top, 0px);
      --sar: env(safe-area-inset-right, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: max(28px, var(--sat)) max(20px, var(--sar)) max(28px, var(--sab)) max(20px, var(--sal));
      overflow-x: hidden;
      color: var(--white);
      background:
        radial-gradient(circle at 75% 18%, rgba(53, 91, 148, .16), transparent 28rem),
        radial-gradient(circle at 18% 88%, rgba(212, 175, 55, .11), transparent 32rem),
        var(--black);
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .25;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 64px 64px;
      mask-image: linear-gradient(to bottom, #000, transparent 94%);
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .62; transform: none !important; }
    :focus-visible { outline: 2px solid var(--gold-bright); outline-offset: 3px; }

    .auth-shell { width: min(100%, 450px); }
    .back-link {
      display: inline-flex;
      margin-bottom: 14px;
      color: var(--muted);
      font: 600 11px/1.4 'JetBrains Mono', monospace;
      letter-spacing: .06em;
      text-decoration: none;
      text-transform: uppercase;
    }
    .back-link:hover { color: var(--gold); }

    .login-container {
      position: relative;
      overflow: hidden;
      width: 100%;
      padding: 34px;
      border: 1px solid rgba(212, 175, 55, .45);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(27,27,34,.97), rgba(10,10,14,.98));
      box-shadow: 0 28px 90px rgba(0,0,0,.55), inset 0 1px rgba(255,255,255,.035);
    }

    .login-container::after {
      content: '';
      position: absolute;
      inset: 55% -35% -35% 20%;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle, rgba(212,175,55,.1), transparent 68%);
    }
    .login-container > * { position: relative; z-index: 1; }

    .logo-section { text-align: center; margin-bottom: 14px; }
    .logo-section img {
      width: 78px;
      height: 78px;
      border: 1px solid rgba(212,175,55,.35);
      border-radius: 14px;
      filter: drop-shadow(0 0 16px rgba(212,175,55,.25));
    }

    .login-title {
      margin: 0;
      color: var(--gold);
      font: 700 30px/1 'Rajdhani', sans-serif;
      letter-spacing: .14em;
      text-align: center;
      text-transform: uppercase;
    }
    .login-subtitle { margin: 8px 0 24px; color: var(--silver); font-size: 14px; text-align: center; }

    .message {
      display: none;
      margin-bottom: 14px;
      padding: 11px 13px;
      border: 1px solid rgba(231,76,60,.5);
      border-radius: 7px;
      color: #FF8B7F;
      background: rgba(231,76,60,.1);
      font-size: 13px;
      line-height: 1.45;
    }
    .message.show { display: block; }
    .message.success { color: #69E6A0; border-color: rgba(46,204,113,.5); background: rgba(46,204,113,.1); }

    .oauth-btn {
      width: 100%;
      min-height: 47px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 10px;
      border-radius: 7px;
      font-size: 14px;
      font-weight: 700;
      transition: transform .18s ease, opacity .18s ease, box-shadow .18s ease;
    }
    .oauth-btn:hover { transform: translateY(-1px); }
    .oauth-google { color: #3c4043; background: #fff; border: 1px solid #dadce0; }
    .oauth-google:hover { box-shadow: 0 3px 12px rgba(0,0,0,.35); }
    .oauth-apple { color: #fff; background: #000; border: 1px solid #444; }
    .oauth-mark { width: 20px; font-size: 16px; font-weight: 800; text-align: center; }

    .auth-or {
      display: flex;
      align-items: center;
      gap: 11px;
      margin: 16px 0;
      color: var(--muted);
      font: 600 10px/1 'JetBrains Mono', monospace;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .auth-or::before, .auth-or::after { content: ''; flex: 1; height: 1px; background: rgba(212,175,55,.22); }

    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      margin-bottom: 20px;
      overflow: hidden;
      border: 1px solid rgba(212,175,55,.25);
      border-radius: 7px;
      background: var(--black);
    }
    .auth-tab {
      min-height: 44px;
      border: 0;
      color: var(--silver);
      background: transparent;
      font: 700 11px/1 'JetBrains Mono', monospace;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .auth-tab.active { color: var(--black); background: var(--gold); }

    .auth-panel[hidden] { display: none; }
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block;
      margin-bottom: 7px;
      color: var(--gold);
      font: 700 11px/1.3 'JetBrains Mono', monospace;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .optional { color: var(--muted); font-weight: 500; text-transform: none; }
    .form-input {
      width: 100%;
      min-height: 47px;
      padding: 0 13px;
      border: 1px solid rgba(212,175,55,.28);
      border-radius: 7px;
      outline: none;
      color: var(--white);
      background: var(--black);
      font-size: 16px;
      transition: border-color .18s ease, box-shadow .18s ease;
    }
    .form-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,175,55,.1); }
    .form-input::placeholder { color: #55535B; }

    .login-btn {
      width: 100%;
      min-height: 49px;
      margin-top: 3px;
      border: 1px solid var(--gold);
      border-radius: 7px;
      color: var(--black);
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      font: 700 13px/1 'JetBrains Mono', monospace;
      letter-spacing: .06em;
      text-transform: uppercase;
      box-shadow: 0 8px 26px rgba(212,175,55,.15);
      transition: transform .18s ease, filter .18s ease;
    }
    .login-btn:hover { transform: translateY(-1px); filter: brightness(1.06); }

    .text-btn {
      display: block;
      width: 100%;
      min-height: 44px;
      margin-top: 6px;
      border: 0;
      color: var(--silver);
      background: transparent;
      font-size: 12px;
      font-weight: 600;
    }
    .text-btn:hover { color: var(--gold); }
    .helper-text { margin: 16px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; text-align: center; }
    .footer { margin-top: 18px; color: #55535B; font-size: 11px; text-align: center; }

    @media (max-width: 520px) {
      .login-container { padding: 26px 20px; }
      .login-title { font-size: 26px; }
      .logo-section img { width: 68px; height: 68px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <a class="back-link" href="landing.html">← Back to Dynasty HQ</a>
    <section class="login-container" aria-labelledby="loginTitle">
      <div class="logo-section"><img src="icon-192.png" alt="Dynasty HQ"></div>
      <h1 class="login-title" id="loginTitle">Dynasty HQ</h1>
      <p class="login-subtitle">Sign in to your fantasy front office</p>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <button type="button" id="btnGoogle" class="oauth-btn oauth-google"><span class="oauth-mark" aria-hidden="true">G</span>Continue with Google</button>
      <button type="button" id="btnApple" class="oauth-btn oauth-apple"><span class="oauth-mark" aria-hidden="true">●</span>Continue with Apple</button>
      <div class="auth-or">or use email</div>

      <div class="auth-tabs" role="tablist" aria-label="Account access">
        <button type="button" class="auth-tab active" id="tabSignin" role="tab" aria-selected="true" aria-controls="panelSignin">Sign in</button>
        <button type="button" class="auth-tab" id="tabSignup" role="tab" aria-selected="false" aria-controls="panelSignup">Create account</button>
      </div>

      <form id="panelSignin" class="auth-panel" role="tabpanel" aria-labelledby="tabSignin">
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
        </div>
        <button type="submit" id="btnSignin" class="login-btn">Sign in</button>
        <button type="button" id="btnReset" class="text-btn">Forgot password?</button>
      </form>

      <form id="panelSignup" class="auth-panel" role="tabpanel" aria-labelledby="tabSignup" hidden>
        <div class="form-group">
          <label class="form-label" for="displayName">Display name <span class="optional">(optional)</span></label>
          <input type="text" id="displayName" class="form-input" placeholder="How your league sees you" autocomplete="name">
        </div>
        <div class="form-group">
          <label class="form-label" for="signupEmail">Email</label>
          <input type="email" id="signupEmail" class="form-input" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="signupPassword">Password</label>
          <input type="password" id="signupPassword" class="form-input" placeholder="At least 8 characters" autocomplete="new-password" minlength="8" required>
        </div>
        <button type="submit" id="btnSignup" class="login-btn">Create free account</button>
      </form>

      <p class="helper-text">Secure account access powered by Dynasty HQ.</p>
    </section>
    <footer class="footer">© 2026 C2Football. All rights reserved.</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.101.1/dist/umd/supabase.min.js"></script>
  <script>
    const FW_API_BASE = 'https://sxshiqyxhhifvtfqawbq.supabase.co/functions/v1';
    const FW_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN4c2hpcXl4aGhpZnZ0ZnFhd2JxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MTExMzAsImV4cCI6MjA4ODI4NzEzMH0.zJi9W986ZLaANiZN6pt6ReFwaQU6yPeidsERIWo2ibI';
    const SUPABASE_URL = 'https://sxshiqyxhhifvtfqawbq.supabase.co';
    const SESSION_KEY = 'fw_session_v1';
    const WARROOM_URL = 'index.html';
    const messageEl = document.getElementById('message');
    const signinForm = document.getElementById('panelSignin');
    const signupForm = document.getElementById('panelSignup');
    let sbClient = null;

    function getSbClient() {
      if (!sbClient && window.supabase) sbClient = window.supabase.createClient(SUPABASE_URL, FW_ANON_KEY);
      return sbClient;
    }

    function destination() {
      try {
        const profile = JSON.parse(localStorage.getItem('od_profile_v1') || 'null');
        return (!profile || !profile.onboardingComplete) ? 'onboarding.html' : WARROOM_URL;
      } catch { return 'onboarding.html'; }
    }

    function showMessage(message, type = 'error') {
      messageEl.textContent = message;
      messageEl.classList.toggle('success', type === 'success');
      messageEl.classList.add('show');
      if (type !== 'success') setTimeout(() => messageEl.classList.remove('show'), 6000);
    }

    function switchMode(mode) {
      const signin = mode === 'signin';
      signinForm.hidden = !signin;
      signupForm.hidden = signin;
      document.getElementById('tabSignin').classList.toggle('active', signin);
      document.getElementById('tabSignup').classList.toggle('active', !signin);
      document.getElementById('tabSignin').setAttribute('aria-selected', String(signin));
      document.getElementById('tabSignup').setAttribute('aria-selected', String(!signin));
      messageEl.classList.remove('show', 'success');
      (signin ? document.getElementById('email') : document.getElementById('signupEmail')).focus();
    }

    async function authenticate(endpoint, body, button, workingLabel) {
      const originalLabel = button.textContent;
      button.disabled = true;
      button.textContent = workingLabel;
      try {
        const response = await fetch(`${FW_API_BASE}/${endpoint}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': FW_ANON_KEY, 'Authorization': `Bearer ${FW_ANON_KEY}` },
          body: JSON.stringify(body),
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || (endpoint === 'fw-signin' ? 'Invalid email or password.' : 'Account creation failed.'));
        localStorage.setItem(SESSION_KEY, JSON.stringify(data));
        return data;
      } catch (error) {
        showMessage(error?.message || 'Unable to connect. Please try again.');
        button.disabled = false;
        button.textContent = originalLabel;
        return null;
      }
    }

    signinForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) { showMessage('Email and password are required.'); return; }
      const data = await authenticate('fw-signin', { email, password }, document.getElementById('btnSignin'), 'Signing in…');
      if (!data) return;
      showMessage('Welcome back. Opening Dynasty HQ…', 'success');
      setTimeout(() => { window.location.href = WARROOM_URL; }, 500);
    });

    signupForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;
      const displayName = document.getElementById('displayName').value.trim();
      if (!email || !password) { showMessage('Email and password are required.'); return; }
      if (password.length < 8) { showMessage('Password must be at least 8 characters.'); return; }
      const data = await authenticate('fw-signup', { email, password, displayName, productSlug: 'war_room' }, document.getElementById('btnSignup'), 'Creating account…');
      if (!data) return;
      showMessage('Account created. Setting up Dynasty HQ…', 'success');
      setTimeout(() => { window.location.href = 'onboarding.html'; }, 500);
    });

    async function startOAuth(provider, button) {
      const db = getSbClient();
      if (!db) { showMessage('Secure sign-in is still loading. Please try again.'); return; }
      button.disabled = true;
      const { error } = await db.auth.signInWithOAuth({ provider, options: { redirectTo: window.location.origin + window.location.pathname } });
      if (error) { showMessage(error.message || 'Unable to start secure sign-in.'); button.disabled = false; }
    }

    document.getElementById('btnGoogle').addEventListener('click', (event) => startOAuth('google', event.currentTarget));
    document.getElementById('btnApple').addEventListener('click', (event) => startOAuth('apple', event.currentTarget));
    document.getElementById('tabSignin').addEventListener('click', () => switchMode('signin'));
    document.getElementById('tabSignup').addEventListener('click', () => switchMode('signup'));
    document.getElementById('btnReset').addEventListener('click', async (event) => {
      const email = document.getElementById('email').value.trim();
      if (!email) { showMessage('Enter your email first, then request a reset link.'); return; }
      const button = event.currentTarget;
      button.disabled = true;
      button.textContent = 'Sending reset link…';
      try {
        await fetch(`${FW_API_BASE}/fw-request-password-reset`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'apikey': FW_ANON_KEY, 'Authorization': `Bearer ${FW_ANON_KEY}` },
          body: JSON.stringify({ email }),
        });
        showMessage('If that email exists, a reset link is on the way.', 'success');
      } catch { showMessage('If that email exists, a reset link is on the way.', 'success'); }
      finally { button.disabled = false; button.textContent = 'Forgot password?'; }
    });

    (async function restoreSession() {
      try {
        const db = getSbClient();
        if (db) {
          const { data } = await db.auth.getSession();
          if (data?.session) {
            const user = data.session.user;
            localStorage.setItem(SESSION_KEY, JSON.stringify({
              token: data.session.access_token,
              user: { email: user.email, displayName: user.user_metadata?.full_name || user.user_metadata?.name || user.email },
            }));
            window.location.href = destination();
            return;
          }
        }
        const session = JSON.parse(localStorage.getItem(SESSION_KEY) || 'null');
        if (session?.token && session?.user) window.location.href = destination();
      } catch {}
    })();
  </script>
</body>
</html>
