<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DHQ — iPhone &amp; iPad Module Gallery v1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* == DESIGN SYSTEM == */
</style>
</head>
<body>
<div class="toolbar">
    <span class="tb-brand">DHQ MODULE GALLERY</span>
    <div class="seg" role="tablist" aria-label="Device">
        <button class="tbtn on" id="devPhone">iPhone</button>
        <button class="tbtn" id="devTablet">iPad</button>
    </div>
    <button class="tbtn" id="fitBtn" title="Scale the iPad frame to fit a laptop window">Fit</button>
    <select class="tsel" id="jump" aria-label="Jump to screen"></select>
    <button class="tbtn" id="prevBtn" aria-label="Previous screen">◀</button>
    <button class="tbtn" id="nextBtn" aria-label="Next screen">▶</button>
    <button class="tbtn" id="notesBtn">Annotations</button>
    <span class="tb-count" id="count"></span>
</div>
<div class="stage fit" id="stage">
    <div class="device" id="device">
        <div class="dvc" id="dvc">
            <div class="gv-sidebar" id="sbNav"></div>
            <div style="display:flex;flex-direction:column;flex:1;min-width:0;min-height:0">
                <div class="gv-status" id="statusBar"><span>9:41</span><span>5G ▪▪▪▪ 87%</span></div>
                <div class="gv-lhdr" id="leagueHdr"><div class="t">THE IRON LEAGUE</div><div class="m">WK 8 · 5-2 · RANK #3 · CRUSINBERRY EMPIRE</div></div>
                <div class="screens" id="screens">
<!-- SCREENS -->
                </div>
            </div>
            <div class="wr-phone-dock" id="dock"></div>
        </div>
    </div>
</div>
<script>
(function () {
    'use strict';
    // Nav registry — mirrors buildLeagueNavItems() + NAV_ICON_PATHS
    // (warroom/js/league-detail.js:185-225). Dock strips the sections.
    var ICON = {
        home: ['M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1v-8.5Z'],
        roster: ['M12 3l7 3.5v5.2c0 4.5-3 7.5-7 8.3-4-.8-7-3.8-7-8.3V6.5L12 3Z', 'M8.7 12.2l2.1 2.1 4.5-4.7'],
        gameday: ['M13 3 5 14h5l-1 7 8-11h-5l1-7Z'],
        compare: ['M7 7h10M7 17h10', 'M9 4 6 7l3 3', 'M15 14l3 3-3 3'],
        trade: ['M7 7h11m0 0-3-3m3 3-3 3', 'M17 17H6m0 0 3 3m-3-3 3-3'],
        fa: ['M12 3v18', 'M7 7.5c0-1.8 2-3 5-3 2.8 0 4.8 1.2 4.8 3.4 0 2.4-2.2 3.2-4.8 3.2S7.2 12 7.2 14.4 9.4 18 12.3 18c2.3 0 4.2-.8 5.1-2.2'],
        draft: ['M12 3l8 16H4L12 3Z', 'M12 8v5'],
        analytics: ['M5 19V9', 'M12 19V5', 'M19 19v-7'],
        office: ['M4 8h16v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V8Z', 'M9 8V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v3', 'M4 12h16', 'M10 14h4'],
        trophy: ['M8 4h8v4a4 4 0 0 1-8 0V4Z', 'M6 5H4v2a3 3 0 0 0 4 2', 'M18 5h2v2a3 3 0 0 1-4 2', 'M12 12v5', 'M8 21h8', 'M9 17h6'],
        settings: ['M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z', 'M12 3v2', 'M12 19v2', 'M3 12h2', 'M19 12h2', 'M5.6 5.6 7 7', 'M17 17l1.4 1.4', 'M18.4 5.6 17 7', 'M7 17l-1.4 1.4'],
        legend: ['M4 5h16', 'M4 12h16', 'M4 19h16', 'M7 5v14', 'M11 5v14'],
        refresh: ['M21 12a9 9 0 0 1-14.8 6.9', 'M3 12A9 9 0 0 1 17.8 5.1', 'M17 3v4h4', 'M7 21v-4H3']
    };
    var NAV = [
        { section: 'FRONT OFFICE' },
        { label: 'Home', tab: 'dashboard', icon: 'home' },
        { label: 'My Roster', tab: 'myteam', icon: 'roster' },
        { label: 'Game Day', tab: 'lineup', icon: 'gameday' },
        { label: 'Compare', tab: 'compare', icon: 'compare' },
        { section: 'LEAGUE' },
        { label: 'Trade Center', tab: 'trades', icon: 'trade' },
        { label: 'Free Agency', tab: 'fa', icon: 'fa' },
        { label: 'Draft', tab: 'draft', icon: 'draft' },
        { label: 'Analytics', tab: 'analytics', icon: 'analytics' },
        { section: 'DOSSIER' },
        { label: "GM's Office", tab: 'alex', icon: 'office' },
        { label: 'Trophy Room', tab: 'trophies', icon: 'trophy' },
        { section: 'SETTINGS' },
        { label: 'Settings', tab: 'settings', icon: 'settings' },
        { label: 'Legend', tab: 'legend', icon: 'legend' }
    ];
    function svgFor(key, size) {
        var paths = ICON[key] || ICON.home;
        var d = paths.map(function (p) { return '<path d="' + p + '"/>'; }).join('');
        return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';
    }

    var screens = Array.prototype.slice.call(document.querySelectorAll('.screen'));
    var device = document.getElementById('device');
    var dvc = document.getElementById('dvc');
    var stage = document.getElementById('stage');
    var jump = document.getElementById('jump');
    var dock = document.getElementById('dock');
    var sbNav = document.getElementById('sbNav');
    var idx = 0, tablet = false;

    // Build the jump select, grouped
    var groups = {};
    screens.forEach(function (s, i) {
        var g = s.getAttribute('data-group') || 'OTHER';
        if (!groups[g]) { groups[g] = document.createElement('optgroup'); groups[g].label = g; jump.appendChild(groups[g]); }
        var o = document.createElement('option');
        o.value = i; o.textContent = (i + 1) + ' · ' + (s.getAttribute('data-title') || s.id);
        groups[g].appendChild(o);
    });

    // PhoneDock — real chip anatomy, active per screen's data-nav
    function buildDock(activeTab) {
        var html = '<div class="wr-dock-strip" id="dockStrip">';
        NAV.forEach(function (it) {
            if (!it.tab) return;
            var on = it.tab === activeTab;
            html += '<button class="wr-dock-chip' + (on ? ' is-active' : '') + '" data-tab="' + it.tab + '">' + svgFor(it.icon, 20) + '<span>' + it.label.toUpperCase() + '</span></button>';
        });
        html += '</div><button class="wr-dock-ask"><span class="wr-dock-ask-glyph">✦</span><span>ALEX</span></button>';
        dock.innerHTML = html;
        var strip = document.getElementById('dockStrip');
        var act = strip.querySelector('.is-active');
        if (act) strip.scrollLeft = Math.max(0, act.offsetLeft - (strip.clientWidth - act.offsetWidth) / 2);
        function fades() {
            strip.classList.toggle('has-left', strip.scrollLeft > 4);
            strip.classList.toggle('has-right', strip.scrollLeft < strip.scrollWidth - strip.clientWidth - 4);
        }
        strip.addEventListener('scroll', fades); fades();
        strip.querySelectorAll('.wr-dock-chip').forEach(function (c) {
            c.addEventListener('click', function () {
                var t = c.getAttribute('data-tab');
                var target = screens.findIndex(function (s) { return s.getAttribute('data-nav') === t; });
                if (target >= 0) show(target);
            });
        });
    }

    // iPad sidebar — desktop nav idiom
    function buildSidebar(activeTab) {
        var html = '<div class="gv-sb-brand">WAR ROOM</div>';
        NAV.forEach(function (it) {
            if (it.section) { html += '<div class="gv-sb-sec">' + it.section + '</div>'; return; }
            var on = it.tab === activeTab;
            html += '<div class="gv-sb-item' + (on ? ' on' : '') + '" data-tab="' + it.tab + '">' + svgFor(it.icon, 17) + '<span>' + it.label + '</span></div>';
        });
        html += '<div style="flex:1"></div><div class="gv-sb-item">' + svgFor('refresh', 17) + '<span>Refresh Data</span></div>';
        sbNav.innerHTML = html;
        sbNav.querySelectorAll('.gv-sb-item[data-tab]').forEach(function (c) {
            c.addEventListener('click', function () {
                var t = c.getAttribute('data-tab');
                var target = screens.findIndex(function (s) { return s.getAttribute('data-nav') === t; });
                if (target >= 0) show(target);
            });
        });
    }

    function show(i) {
        idx = (i + screens.length) % screens.length;
        screens.forEach(function (s, j) { s.classList.toggle('active', j === idx); });
        var s = screens[idx];
        var nav = s.getAttribute('data-nav') || '';
        dvc.classList.toggle('no-nav', nav === '');
        buildDock(nav); buildSidebar(nav);
        jump.value = String(idx);
        document.getElementById('count').textContent = (idx + 1) + ' / ' + screens.length + ' · ' + (s.getAttribute('data-title') || '');
        s.scrollTop = 0;
    }

    document.getElementById('devPhone').addEventListener('click', function () {
        tablet = false; device.classList.remove('tablet');
        this.classList.add('on'); document.getElementById('devTablet').classList.remove('on');
    });
    document.getElementById('devTablet').addEventListener('click', function () {
        tablet = true; device.classList.add('tablet');
        this.classList.add('on'); document.getElementById('devPhone').classList.remove('on');
    });
    document.getElementById('fitBtn').addEventListener('click', function () {
        stage.classList.toggle('fit'); this.classList.toggle('on');
    });
    document.getElementById('fitBtn').classList.add('on');
    document.getElementById('notesBtn').addEventListener('click', function () {
        device.classList.toggle('show-notes'); this.classList.toggle('on');
    });
    document.getElementById('prevBtn').addEventListener('click', function () { show(idx - 1); });
    document.getElementById('nextBtn').addEventListener('click', function () { show(idx + 1); });
    jump.addEventListener('change', function () { show(parseInt(jump.value, 10)); });
    document.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowLeft') show(idx - 1);
        if (e.key === 'ArrowRight') show(idx + 1);
    });

    show(0);
})();
</script>
</body>
</html>
