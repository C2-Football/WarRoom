<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dynasty HQ · Player comparison preview</title><link rel="icon" href="../icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script><script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<style>body{margin:0;background:#080b10;color:#fff;font:14px system-ui}.preview-note{max-width:1120px;margin:16px auto;padding:12px 20px;border:1px solid #d4af3740;border-radius:10px;color:#c7ced8;font:14px/1.5 system-ui}.preview-note a{color:#e7bd58;margin-right:16px}.preview-note p{margin:4px 0}#root{max-width:1180px;margin:auto}button{font:inherit}</style></head><body><div class="preview-note"><b>Design preview · Sample data</b><p>This renders the application’s real comparison component with illustrative stats and values.</p><a href="?players=2">Head to head</a><a href="?players=4">Four players</a><a href="?players=0">Empty</a><a href="?players=2&pro=0">Free account</a><a href="?players=2&redraft=1">Redraft</a><a href="?players=2&mixed=1">Mixed seasons</a></div><div id="root">Loading preview…</div>
<script>
(async function () {
    // Reuse production CSS, including the shared phone search sheet and tokens.
    const documentSource = new DOMParser().parseFromString(await (await fetch('../index.html')).text(), 'text/html');
    documentSource.querySelectorAll('style,link[rel="stylesheet"]').forEach(node => {
        const clone = node.cloneNode(true);
        if (clone.tagName === 'LINK') {
            const href = clone.getAttribute('href');
            clone.href = new URL(href, new URL('../index.html', location.href)).href;
            clone.media = 'all';
        } else {
            clone.textContent = clone.textContent.replace(/url\((['"]?)([^'"\)]+)\1\)/g, (_, quote, url) => 'url("' + new URL(url, new URL('../index.html', location.href)).href + '")');
        }
        document.head.appendChild(clone);
    });
    const override = document.createElement('style'); override.textContent = 'body{margin:0!important}.preview-note{margin:16px auto!important}.preview-note a{display:inline-block;min-height:40px;line-height:40px}#root{max-width:1180px;margin:auto}.wr-module-strip{margin-bottom:14px}'; document.head.appendChild(override);
    const params = new URLSearchParams(location.search);
    const count = Number(params.get('players') ?? 2), pro = params.get('pro') !== '0', redraft = params.has('redraft');
    const ids = ['7564','6794','6786','7547'];
    const people = [['Ja’Marr','Chase','CIN',26],['Justin','Jefferson','MIN',27],['CeeDee','Lamb','DAL',27],['Amon-Ra','St. Brown','DET',26]];
    const players = Object.fromEntries(ids.map((id,i)=>[id,{player_id:id,first_name:people[i][0],last_name:people[i][1],full_name:people[i][0]+' '+people[i][1],team:people[i][2],age:people[i][3],position:'WR',years_exp:5,active:true}]));
    const statsData = Object.fromEntries(ids.map((id,i)=>[id,{season:2026,gp:5,rec:45-i*4,rec_tgt:59-i*5,rec_yd:640-i*65,rec_td:6-i}]));
    const priorData = Object.fromEntries(ids.map((id,i)=>[id,{season:2025,gp:17,rec:110-i*5,rec_tgt:156-i*6,rec_yd:1450-i*85,rec_td:12-i}]));
    if (params.has('mixed')) delete statsData[ids[1]];
    const hist = [[28.4,22.1,34.5,19.2,40.8],[24.2,31.5,17.8,28.6,26.4],[12.8,26.5,24.8,19.6,28.3],[18.4,25.7,14.5,22.6,14.3]];
    if (params.get('case') === 'missing') ids.forEach(id => { delete statsData[id]; delete priorData[id]; });
    if (params.get('case') === 'negative') { statsData[ids[0]] = { season: 2026, gp: 5, rec: 0, rec_yd: -20, rec_td: 0 }; hist[0] = [0,-1,0,-2,-1]; }
    window.App={normPos:p=>p,POS_COLORS:{WR:'#e7bd58'},LI:{playerScores:Object.fromEntries(ids.map((id,i)=>[id,9850-i*420])),playerMeta:Object.fromEntries(ids.map((id,i)=>[id,{roleLabel:'Featured receiver',opportunityLabel: i?'High-volume role':'Primary target'}]))},getAgeCurve:()=>({peak:[24,29],decline:[30,32]}),calcRawPts:(raw,scoring)=>Object.entries(scoring).reduce((n,[k,v])=>n+(raw[k]||0)*v,0),WeeklyProj:{weeklyHistory:id=>params.get('case') === 'missing' ? [] : (hist[ids.indexOf(id)]||[]).map((pts,i)=>({week:i+1,pts}))}};
    window.WR={GmMode:{useGmEffects:()=>({targetPositions:new Set(),marketPosture:'hold'})}};
    window.wrIsPro=()=>pro;
    window.getPlayerAction=id=>({label:id===ids[0]?'Hold core':'Hold'});
    window.WR.openPlayerCard=id=>{const modal=document.createElement('dialog');modal.style.cssText='background:#142236;color:white;border:1px solid #e7bd58;border-radius:16px;padding:24px;max-width:85vw';const title=document.createElement('h2');title.textContent=players[id].full_name;modal.append(title);const body=document.createElement('p');body.textContent='Preview: this action opens the full player card in the app.';modal.append(body);const close=document.createElement('button');close.textContent='Close';close.onclick=()=>modal.remove();modal.append(close);document.body.append(modal);modal.showModal()};
    const load=src=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.append(s)});
    await load('../js/shared/viewport.js');
    await load('../dist-preview/compiled/js/components/wr-primitives.js');
    await load('../js/utils/player-comparison.js');
    await load('../js/utils/team-comparison.js');
    await load('../dist-preview/compiled/js/tabs/compare.js');
    const leagueId='comparison-design-preview-'+count+'-'+pro+'-'+redraft+'-'+params.has('mixed');
    window.App.LI_LOADED=true; window.App.LI.sourceLeagueId=leagueId;
    localStorage.setItem('wr_compare_scope_'+leagueId,'players');
    localStorage.setItem('wr_compare_players_'+leagueId,JSON.stringify(ids.slice(0,count)));
    const roster={roster_id:1,owner_id:'preview',players:ids,starters:ids,settings:{wins:3,losses:2}};
    const league={league_id:leagueId,season:'2026',name:'Design preview',rosters:[roster],users:[],scoring_settings:{rec:1,rec_yd:.1,rec_td:6},settings:{type:redraft?0:2}};
    const skin={type:redraft?'redraft':'dynasty',features:{},vocabulary:{valueShortLabel:redraft?'ROS':'DHQ',valueLabel:redraft?'ROS Value':'DHQ Value'}};
    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(window.CompareTab,{currentLeague:league,leagueSkin:skin,myRoster:roster,playersData:players,statsData,stats2025Data:priorData,standings:[],sleeperUserId:'preview'}));
})().catch(error=>{document.getElementById('root').textContent=error.message;console.error(error)});
</script></body></html>
